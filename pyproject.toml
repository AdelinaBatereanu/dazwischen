[project]
name = "dazwischen"
version = "0.1.0"
description = "ChatGPT-facing MCP proxy challenge skeleton"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
